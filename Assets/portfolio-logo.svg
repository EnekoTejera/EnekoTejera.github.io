<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Geometric portfolio logo</title>
  <desc id="desc">Rotated square divided by a long diagonal, a short lower-left diagonal and a nearly horizontal line.</desc>

  <g fill="none"
     stroke="currentColor"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Outer rotated square -->
    <path d="M190 30 L368 209 L207 370 L30 191 Z"/>

    <!-- Long diagonal, from the upper-left edge to the lower-right edge -->
    <path d="M113 108 L290 287"/>

    <!-- Short diagonal, from the lower-left edge to the center -->
    <path d="M123 285 L205 201"/>

    <!-- Nearly horizontal line, from the left corner to the right corner -->
    <path d="M30 191 L368 209"/>
  </g>
</svg>
